[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; two 1.9 MB OTA slots
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    bblanchon/ArduinoJson@^7.2.0
board_build.embed_txtfiles = src/portal_page.html
board_build.embed_files = src/x509_crt_bundle.bin
build_flags =
    -DFW_VERSION=\"0.1.0\"
