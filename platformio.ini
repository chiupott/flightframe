[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; two 1.9 MB OTA slots
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    bblanchon/ArduinoJson@^7.2.0
board_build.embed_txtfiles = src/portal_page.html
board_build.embed_files = src/x509_crt_bundle.bin
build_flags =
    -DFW_VERSION=\"0.1.0\"

; Seengreat ESP32-C6 e-paper driver board (the kit Sam received). Needs the pioarduino platform (Arduino core 3.x) for the C6.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    zinggjm/GxEPD2@^1.6.0
    bblanchon/ArduinoJson@^7.2.0
board_build.embed_txtfiles = src/portal_page.html
board_build.embed_files = src/x509_crt_bundle.bin
build_flags =
    -DFW_VERSION=\"0.1.0\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Local build for a frame whose key is baked in (never committed, never in a public release): FF_ASSET_KEY=<read-only key> pio run -e esp32c6-key -t upload
[env:esp32c6-key]
extends = env:esp32c6
build_flags =
    ${env:esp32c6.build_flags}
    -DFF_ASSET_KEY=\"${sysenv.FF_ASSET_KEY}\"
